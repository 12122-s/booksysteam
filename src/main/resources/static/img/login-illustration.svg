<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" role="img"
     aria-labelledby="t d">
  <title id="t">图书室插画</title>
  <desc id="d">一个书架、一盆绿植和一个盘腿坐着看书的人</desc>

  <!-- 背景色块 -->
  <circle cx="330" cy="248" r="206" fill="#dbeafe" opacity=".75"/>
  <circle cx="452" cy="150" r="74" fill="#ede9fe" opacity=".9"/>
  <ellipse cx="330" cy="436" rx="238" ry="24" fill="#c7d2fe" opacity=".45"/>

  <!-- 漂浮的小元素 -->
  <circle cx="104" cy="66" r="8" fill="#a5b4fc" opacity=".85"/>
  <circle cx="548" cy="318" r="10" fill="#93c5fd" opacity=".7"/>
  <circle cx="296" cy="44" r="5.5" fill="#f472b6" opacity=".7"/>
  <circle cx="212" cy="424" r="6" fill="#60a5fa" opacity=".6"/>
  <g transform="rotate(-16 188 70)">
    <rect x="162" y="50" width="54" height="38" rx="5" fill="#93c5fd"/>
    <rect x="162" y="50" width="8" height="38" rx="4" fill="#60a5fa"/>
  </g>
  <g transform="rotate(14 520 118)">
    <rect x="496" y="100" width="46" height="32" rx="5" fill="#fcd34d"/>
    <rect x="496" y="100" width="7" height="32" rx="3.5" fill="#f59e0b"/>
  </g>
  <path d="M92 262 l0 22 M81 273 l22 0" stroke="#a5b4fc" stroke-width="4"
        stroke-linecap="round"/>

  <!-- 书架 -->
  <rect x="66" y="118" width="206" height="238" rx="14" fill="#ffffff"
        stroke="#dbe3f0" stroke-width="3"/>
  <line x1="80" y1="196" x2="258" y2="196" stroke="#e2e8f0"
        stroke-width="7" stroke-linecap="round"/>
  <line x1="80" y1="278" x2="258" y2="278" stroke="#e2e8f0"
        stroke-width="7" stroke-linecap="round"/>

  <!-- 第一层书 -->
  <rect x="86" y="132" width="22" height="56" rx="3" fill="#60a5fa"/>
  <rect x="112" y="144" width="18" height="44" rx="3" fill="#f472b6"/>
  <rect x="134" y="126" width="24" height="62" rx="3" fill="#34d399"/>
  <rect x="162" y="148" width="16" height="40" rx="3" fill="#fbbf24"/>
  <g transform="rotate(12 214 160)">
    <rect x="200" y="134" width="22" height="54" rx="3" fill="#a78bfa"/>
  </g>

  <!-- 第二层书 -->
  <rect x="86" y="212" width="20" height="58" rx="3" fill="#f87171"/>
  <rect x="110" y="224" width="24" height="46" rx="3" fill="#38bdf8"/>
  <rect x="138" y="208" width="18" height="62" rx="3" fill="#facc15"/>
  <rect x="160" y="232" width="22" height="38" rx="3" fill="#4ade80"/>
  <g transform="rotate(-10 226 240)">
    <rect x="198" y="210" width="20" height="58" rx="3" fill="#c084fc"/>
  </g>

  <!-- 第三层书 -->
  <rect x="86" y="292" width="24" height="46" rx="3" fill="#818cf8"/>
  <rect x="114" y="304" width="18" height="34" rx="3" fill="#fb923c"/>
  <rect x="136" y="288" width="20" height="50" rx="3" fill="#2dd4bf"/>

  <!-- 绿植 -->
  <path d="M300 350 q-28 -20 -24 -50 q26 6 24 50z" fill="#34d399"/>
  <path d="M300 350 q28 -24 22 -54 q-28 8 -22 54z" fill="#10b981"/>
  <path d="M300 348 q-2 -34 0 -46" stroke="#059669" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M282 352 h38 l-5 44 q-1 8 -9 8 h-10 q-8 0 -9 -8z" fill="#fb7185"/>
  <rect x="278" y="346" width="46" height="12" rx="6" fill="#f43f5e"/>

  <!-- 坐垫 -->
  <ellipse cx="424" cy="400" rx="98" ry="27" fill="#bfdbfe"/>

  <!-- 盘着的腿 -->
  <path d="M374 378 q20 -18 50 -18 q30 0 50 18 q11 10 1 18 q-24 16 -51 16
           q-27 0 -51 -16 q-10 -8 1 -18z" fill="#1e40af"/>
  <ellipse cx="388" cy="390" rx="13" ry="9" fill="#1e3a8a"/>
  <ellipse cx="460" cy="390" rx="13" ry="9" fill="#1e3a8a"/>

  <!-- 身体 -->
  <path d="M388 302 q38 -18 74 0 q13 7 15 42 q2 20 -12 26 q-38 12 -80 0
           q-14 -6 -12 -26 q2 -35 15 -42z" fill="#3b82f6"/>

  <!-- 手臂（简化成肩到手的色块） -->
  <path d="M394 324 q-4 22 16 30" stroke="#2563eb" stroke-width="13"
        stroke-linecap="round" fill="none"/>
  <path d="M458 324 q4 22 -16 30" stroke="#2563eb" stroke-width="13"
        stroke-linecap="round" fill="none"/>

  <!-- 手里的书 -->
  <path d="M392 352 l34 -11 l34 11 l-34 13z" fill="#f8fafc"
        stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M426 341 v25" stroke="#cbd5e1" stroke-width="2.5"/>
  <circle cx="394" cy="353" r="8" fill="#fcd9b6"/>
  <circle cx="458" cy="353" r="8" fill="#fcd9b6"/>

  <!-- 头 -->
  <circle cx="426" cy="270" r="28" fill="#fcd9b6"/>
  <path d="M399 266 q6 -33 27 -33 q21 0 27 33 q-11 -13 -27 -13 q-16 0 -27 13z"
        fill="#1f2937"/>
  <circle cx="418" cy="272" r="2.8" fill="#1f2937"/>
  <circle cx="434" cy="272" r="2.8" fill="#1f2937"/>
  <path d="M420 282 q6 5 12 0" stroke="#c2410c" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <circle cx="404" cy="282" r="4" fill="#fca5a5" opacity=".7"/>
  <circle cx="448" cy="282" r="4" fill="#fca5a5" opacity=".7"/>
</svg>
